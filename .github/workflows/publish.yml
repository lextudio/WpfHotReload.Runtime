name: Publish GitHub Package

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet pack WpfHotReload.Runtime.csproj -c Release -p:Version=0.1.0-ci.${{ github.run_number }} -o artifacts
      - run: dotnet nuget push 'artifacts/*.nupkg' --source https://nuget.pkg.github.com/lextudio/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
